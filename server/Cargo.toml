[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
handlebars = "6.4.2"
hostname-validator = "1.1.1"
regex = "1.12.4"
sailfish = "0.11.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
tokio-test = "0.4.5"

[profile.dev]
debug = 2
opt-level = 0
panic = "unwind"
strip = false

[profile.release]
debug = 2
opt-level = 0
panic = "unwind"
strip = false

